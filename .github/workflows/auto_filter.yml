name: Auto Filter Residential IPs

on:
  schedule:
    # 国际标准时间 (UTC)，每 4 小时执行一次 (0点, 4点, 8点, 12点, 16点, 20点)
    - cron: '0 */4 * * *'
  workflow_dispatch: # 允许在网页上随时手动点击运行

permissions:
  contents: write

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 执行筛选程序
        run: |
          python filter.py

      - name: 提交并推送到仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add residential_nodes.json
          git commit -m "Auto update residential IPs: $(date +'%Y-%m-%d %H:%M:%S')" || exit 0
          git push
